runtime = "node"
start = "npm start"
build = "npm install --include=dev && npm run build --if-present"
port_env_var = "PORT"
healthcheck_path = "/api/health"

[env]
DATABASE_URL = { source = "rdbms" }

[[crons]]
name = "patent-reminder-check"
schedule = "0 8 * * 1"
command = "node jobs/patent-reminder.js"
description = "Send patent deadline reminders every Monday morning"