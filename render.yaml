databases:
  - name: alertpulse-db
    plan: free
    region: oregon

services:
  - type: web
    runtime: node
    name: alertpulse
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: alertpulse-db
          property: connectionString
      - key: ADMIN_SECRET
        sync: false
